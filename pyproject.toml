[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvd-cbd-reference-rebuild"
version = "0.2.2"
description = "Source-guided, explicitly uncalibrated CBD reaction-diffusion surrogate reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "Pillow>=10,<13"]

[project.scripts]
cvd-cbd = "cvd_cbd.cli:main"
cvd-study = "cvd_cbd.study_cli:main"

[tool.setuptools.packages.find]
include = ["cvd_cbd*"]
